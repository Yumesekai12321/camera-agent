[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-agent"
version = "4.0.0"
description = "Multi-source computer-screen monitoring agent with Mainflux telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<6",
  "mss>=10,<11",
  "pillow>=11,<13",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "pywin32>=310,<400",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "ultralytics>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["camera_agent*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py311"
