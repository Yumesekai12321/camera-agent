version: 2
fleet:
  preview: true
devices:
- device_id: yume-1
  display_name: Yume 1
  enabled: true
  agent_type: camera
  source_type: rtsp
  source:
    host: 172.16.7.62
    port: 554
    username_env: CAMERA_AGENT_YUME_1_RTSP_USER
    password_env: CAMERA_AGENT_YUME_1_RTSP_PASS
    adapter: tapo
    path: stream1
  mainflux:
    thing_id: f1a0b8e9-4c7d-444b-83e2-ff484a9ebfdc
    thing_key_env: CAMERA_AGENT_YUME_1_MAINFLUX_THING_KEY
  # Add the provisioned non-secret Thing UUID here before enabling remote MQTT
  # control. Keep its key only in CAMERA_AGENT_YUME_1_MAINFLUX_THING_KEY.
  features:
    available: [facebook_monitor, person_guard]
    default: facebook_monitor
    person_guard:
      model_path_env: CAMERA_AGENT_YUME_1_PERSON_MODEL
      model_sha256_env: CAMERA_AGENT_YUME_1_PERSON_MODEL_SHA256
      minimum_confidence: 0.45
      confirmation_frames: 2
      absence_rearm_seconds: 3
      tracking_dead_zone: 0.15
      tracking_move_duration_seconds: 0.25
      tracking_move_interval_seconds: 0.5
  monitor_roi: null
  process_interval: 1.0
  rules:
    template: default
    overrides: {}
  ptz:
    enabled: true
    provider: onvif
    port: 2020
    # A longer bounded segment keeps ONVIF motion continuous instead of
    # producing short start/stop jerks between inference cycles.
    velocity: 0.55
    move_duration_seconds: 2.0
  auto_patrol:
    enabled: false
    observe_seconds: 5
    search_move_interval_seconds: 2.2
    max_alarm_events_per_screen: 3
