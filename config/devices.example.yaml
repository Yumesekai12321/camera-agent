version: 2

fleet:
  preview: true

# Generic examples. YAML stores identifiers and environment-variable names, never
# passwords, credential-bearing URLs or Mainflux Thing keys.
devices:
  - device_id: rtsp-lobby-01
    display_name: Lobby RTSP camera
    enabled: false
    source_type: rtsp
    source:
      adapter: generic
      host: 192.0.2.10
      port: 554
      path: Streaming/Channels/101
      username_env: CAMERA_AGENT_RTSP_LOBBY_01_RTSP_USER
      password_env: CAMERA_AGENT_RTSP_LOBBY_01_RTSP_PASS
    mainflux:
      thing_name: camera-agent-rtsp-lobby-01
      thing_key_env: CAMERA_AGENT_RTSP_LOBBY_01_MAINFLUX_THING_KEY
    monitor_roi: [0.10, 0.15, 0.70, 0.65]
    process_interval: 1.5
    rules:
      template: default
      overrides: {}

  # Tapo is an onboarding preset over the same generic RTSP runtime.
  - device_id: tapo-example-01
    display_name: Tapo RTSP adapter example
    enabled: false
    source_type: rtsp
    source:
      adapter: tapo
      host: 192.0.2.11
      port: 554
      path: stream1
      username_env: CAMERA_AGENT_TAPO_EXAMPLE_01_RTSP_USER
      password_env: CAMERA_AGENT_TAPO_EXAMPLE_01_RTSP_PASS
    mainflux:
      thing_name: camera-agent-tapo-example-01
      thing_key_env: CAMERA_AGENT_TAPO_EXAMPLE_01_MAINFLUX_THING_KEY
    # Experimental: uses the Tapo local camera API through optional pytapo.
    # It is off by default because some C200 firmware builds reject manual siren control.
    physical_alarm:
      enabled: false
      provider: tapo
      duration_seconds: 3
      cooldown_seconds: 30
    process_interval: 1.5
    rules:
      template: default
      overrides: {}

  - device_id: android-display-01
    display_name: Android display source
    enabled: false
    source_type: adb
    source:
      fps: 1.0
      command_timeout: 6
      require_landscape: true
      minimum_frame_std: 2.0
      # serial_env: CAMERA_AGENT_ANDROID_DISPLAY_01_ADB_SERIAL
    mainflux:
      thing_name: camera-agent-android-display-01
      thing_key_env: CAMERA_AGENT_ANDROID_DISPLAY_01_MAINFLUX_THING_KEY
    process_interval: 2.0
    rules:
      template: default
      overrides: {}

  - device_id: scrcpy-window-01
    display_name: Named scrcpy window source
    enabled: false
    source_type: window
    source:
      title: CAMERA-LIVE
      capture_method: auto
      fps: 8.0
      minimum_frame_std: 2.0
    mainflux:
      thing_name: camera-agent-scrcpy-window-01
      thing_key_env: CAMERA_AGENT_SCRCPY_WINDOW_01_MAINFLUX_THING_KEY
    process_interval: 1.5
    rules:
      template: default
      overrides: {}

  - device_id: webcam-01
    display_name: Physical or virtual webcam
    enabled: false
    source_type: webcam
    source:
      index: 0
      backend: dshow
      width: 1280
      height: 720
    mainflux:
      thing_name: camera-agent-webcam-01
      thing_key_env: CAMERA_AGENT_WEBCAM_01_MAINFLUX_THING_KEY
    process_interval: 1.5
    rules:
      template: default
      overrides: {}
